<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPverse Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Montserrat:wght@600;800&family=Bebas+Neue&family=Playfair+Display:wght@700&family=Pacifico&family=Orbitron:wght@600;800&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070d;--panel:#0e0e19;--panel2:#161627;--line:#26263d;--txt:#ececf7;--mut:#8d8daa;--cy:#00e5ff;--vi:#b14dff;--red:#ff0033;--rad:12px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:14px}
body{background:radial-gradient(1200px 500px at 10% -10%,rgba(177,77,255,.12),transparent),radial-gradient(900px 500px at 100% 0,rgba(0,229,255,.08),transparent),var(--bg)}
button,input,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:rgba(8,8,16,.85);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:6px}
.logo{font-family:Orbitron,sans-serif;font-weight:800;font-size:24px;letter-spacing:1px;background:linear-gradient(90deg,var(--cy),var(--vi));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 8px rgba(0,229,255,.55))}
.brandname{font-family:Orbitron,sans-serif;font-weight:600;font-size:15px;color:#d8d8ff}
.brandname b{color:var(--cy);text-shadow:0 0 10px rgba(0,229,255,.6)}
.ver{border:1px solid rgba(0,229,255,.5);background:rgba(0,229,255,.08);color:var(--cy);border-radius:20px;padding:2px 9px;font-size:11px;font-family:Orbitron,sans-serif;cursor:pointer}
.pname{flex:1;min-width:140px;max-width:340px;background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 8px;font-weight:600}
.pname:hover,.pname:focus{border-color:var(--line);background:var(--panel);outline:none}
.hbtns{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;white-space:nowrap;transition:.15s}
.btn:hover{border-color:rgba(0,229,255,.6);box-shadow:0 0 12px rgba(0,229,255,.2)}
.btn.pri{background:linear-gradient(90deg,#6d2bd9,#00a8c6);border-color:transparent;color:#fff;box-shadow:0 0 16px rgba(177,77,255,.35)}
.btn.big{padding:12px 18px;font-size:16px;width:100%}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn.danger:hover{border-color:#ff4d6d;box-shadow:0 0 12px rgba(255,77,109,.3)}
.btn:disabled{opacity:.4;pointer-events:none}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;padding:14px;max-width:1700px;margin:0 auto}
@media(max-width:960px){main{grid-template-columns:minmax(0,1fr);padding:10px}}
.stage{position:relative;background:#000;border-radius:var(--rad);overflow:hidden;border:1px solid var(--line);box-shadow:0 0 0 1px rgba(177,77,255,.15),0 10px 40px rgba(0,0,0,.6);display:flex;justify-content:center;align-items:center;max-height:68vh}
#cv{display:block;max-width:100%;max-height:68vh;width:auto;height:auto}
.drop{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,0,30,.75);border:3px dashed var(--cy);font-size:22px;font-weight:800;color:var(--cy);border-radius:var(--rad);pointer-events:none}
.hidden{display:none!important}
.transport{display:flex;align-items:center;gap:10px;padding:10px 4px}
.transport button{border:1px solid var(--line);background:var(--panel2);border-radius:50%;width:38px;height:38px;cursor:pointer;flex:0 0 auto}
.transport .play{width:48px;height:48px;font-size:18px;background:linear-gradient(135deg,var(--vi),var(--cy));border:0;color:#fff;box-shadow:0 0 18px rgba(0,229,255,.45)}
#tm{font-variant-numeric:tabular-nums;font-size:13px;color:var(--mut);min-width:118px}
input[type=range]{accent-color:var(--cy);width:100%}
#scrub{flex:1}
.tl{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:10px}
.tlhead{display:flex;justify-content:space-between;align-items:center;padding:0 4px 6px;color:var(--mut);font-size:12px}
.tlhead b{color:var(--txt);font-size:13px}
.strip{display:flex;align-items:center;overflow-x:auto;padding:8px 4px 12px;min-height:110px;scrollbar-color:var(--line) transparent}
.clip{flex:0 0 128px;height:84px;border-radius:10px;position:relative;overflow:hidden;border:2px solid transparent;cursor:pointer;background:#111;user-select:none;transition:border-color .15s,box-shadow .15s}
.clip img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.clip.sel{border-color:var(--cy);box-shadow:0 0 14px rgba(0,229,255,.6)}
.clip.on::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 3px var(--vi);border-radius:8px}
.clip .n{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.65);border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700}
.clip .d{position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,.65);border-radius:6px;padding:1px 6px;font-size:11px}
.clip .k{position:absolute;bottom:4px;left:4px;font-size:11px;background:rgba(177,77,255,.75);border-radius:6px;padding:1px 5px}
.clip .tt{position:absolute;inset:0;display:grid;place-items:center;font-family:Orbitron,sans-serif;font-size:12px;text-align:center;padding:6px;text-shadow:0 0 8px var(--cy)}
.clip.over{border-color:var(--vi)}
.tr{flex:0 0 28px;height:28px;margin:0 4px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);font-size:13px;color:var(--cy);cursor:pointer}
.tr:hover{border-color:var(--cy)}
.addcard{flex:0 0 84px;height:84px;margin-left:10px;border-radius:10px;border:2px dashed var(--line);display:grid;place-items:center;font-size:28px;color:var(--mut);cursor:pointer}
.addcard:hover{border-color:var(--cy);color:var(--cy)}
.mstrip{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:4px;font-size:12px;color:var(--mut)}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0}
.pk{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:2px solid var(--line);padding:0;background:#111;cursor:pointer;display:grid;place-items:center;font-size:22px;color:var(--mut)}
.pk img{width:100%;height:100%;object-fit:cover;display:block}
.pk.on{border-color:var(--cy);box-shadow:0 0 10px rgba(0,229,255,.5)}
.pk b{position:absolute;top:3px;right:3px;background:var(--cy);color:#000;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:11px}
.cardpick{display:grid;gap:10px;margin:12px 0}
.cardpick .btn{justify-content:flex-start;text-align:left;padding:14px;white-space:normal}
.cardpick small{display:block;color:var(--mut);font-weight:400;margin-top:2px}
.chip{cursor:pointer}
.lane{position:relative;margin:4px 4px 2px;padding:2px 0;border-top:1px dashed var(--line);cursor:pointer;min-height:22px}
.lrow{position:relative;height:24px;margin:3px 0}
.lblk{position:absolute;top:0;height:22px;border-radius:6px;background:rgba(0,229,255,.16);border:1px solid rgba(0,229,255,.55);font-size:11px;line-height:20px;padding:0 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#cffaff}
.lblk.sel{background:rgba(0,229,255,.42);box-shadow:0 0 10px rgba(0,229,255,.6)}
.lblk.voice{background:rgba(255,80,140,.18);border-color:rgba(255,80,140,.6);color:#ffd0e0}
.phead{position:absolute;top:0;bottom:0;width:2px;background:var(--vi);box-shadow:0 0 6px var(--vi);pointer-events:none}
.lanehint{font-size:12px;color:var(--mut);padding:6px 4px}
.rec{background:#ff2d55!important;color:#fff!important;border-color:#ff2d55!important;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.6}}
.emo{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0}
.emo button{font-size:20px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px;cursor:pointer}
.row textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 8px;font:inherit;color:inherit;resize:vertical}
.mitem.on{border-color:var(--cy)}
.chip{background:rgba(177,77,255,.15);border:1px solid rgba(177,77,255,.4);color:#e6d2ff;border-radius:20px;padding:3px 10px}
aside{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);display:flex;flex-direction:column;min-height:0;align-self:start;position:sticky;top:70px;max-height:calc(100vh - 84px)}
@media(max-width:960px){aside{position:static;max-height:none}}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{flex:1;background:none;border:0;padding:12px 8px;cursor:pointer;color:var(--mut);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--cy);border-bottom-color:var(--cy);text-shadow:0 0 10px rgba(0,229,255,.5)}
.insp{padding:12px 14px 20px;overflow-y:auto}
.sec{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:rgba(255,255,255,.015)}
.sec h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--vi)}
.row{display:grid;grid-template-columns:110px minmax(0,1fr);align-items:center;gap:8px;margin:7px 0}
.row>span{color:var(--mut);font-size:13px}
.row input[type=text],.row input[type=number],.row select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
.row input[type=color]{width:46px;height:30px;border:1px solid var(--line);border-radius:6px;background:none;padding:0}
.row input[type=checkbox]{width:20px;height:20px;accent-color:var(--cy);justify-self:start}
.rg{display:flex;align-items:center;gap:8px}
.rg .val{min-width:44px;text-align:right;font-size:12px;color:var(--cy);font-weight:600}
.ihead{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.ihead .mut,.mut{color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:flex;gap:6px;margin:6px 0 10px}
.acts.wrap{flex-wrap:wrap}
.hint{color:var(--mut);font-size:12px;line-height:1.5;margin:6px 0}
.empty{text-align:center;padding:20px 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.mitem{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:8px;margin:6px 0;background:var(--panel2)}
.mitem .nm{flex:1;min-width:0}
.mitem .nm div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mitem input[type=range]{width:80px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv span{color:var(--mut)}
.modal{position:fixed;inset:0;background:rgba(3,3,10,.78);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50;padding:16px}
.box{background:var(--panel);border:1px solid rgba(0,229,255,.35);border-radius:16px;padding:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 0 40px rgba(177,77,255,.25)}
.box h3{margin:0 0 10px;font-family:Orbitron,sans-serif;color:var(--cy)}
.box ul{padding-left:18px;line-height:1.6}
.bar{height:10px;border-radius:10px;background:var(--panel2);overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--vi),var(--cy));box-shadow:0 0 12px var(--cy)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:#141428;border:1px solid rgba(0,229,255,.5);padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}
footer{text-align:center;color:var(--mut);font-size:11px;padding:10px 0 24px;font-family:Orbitron,sans-serif;letter-spacing:.05em}
code{background:var(--panel2);padding:1px 5px;border-radius:5px}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo">GP</span><span class="brandname">verse <b>Studio</b></span><button id="verBtn" class="ver" title="Novità della versione"></button></div>
  <input id="projName" class="pname" aria-label="Nome progetto">
  <div class="hbtns">
    <label class="btn pri">＋ Media<input type="file" id="fileIn" multiple accept="image/*,video/*,audio/*" hidden></label>
    <button class="btn" id="addTitle">＋ Scheda</button>
    <button class="btn" id="undoBtn" title="Annulla (Ctrl+Z)">↶</button>
    <button class="btn" id="newBtn">Nuovo</button>
    <button class="btn" id="helpBtn" title="Guida">?</button>
  </div>
</header>
<main>
  <section>
    <div class="stage" id="stage"><canvas id="cv"></canvas><div id="drop" class="drop hidden">Rilascia qui foto, video e musica</div></div>
    <div class="transport">
      <button id="toStart" title="Inizio">⏮</button>
      <button id="playBtn" class="play" title="Play/Pausa (spazio)">▶</button>
      <button id="splitBtn" title="Dividi la clip qui (S)">✂</button>
      <span id="tm">0:00.0 / 0:00.0</span>
      <input type="range" id="scrub" min="0" max="1" step="0.01" value="0" aria-label="Posizione">
    </div>
    <div class="tl">
      <div class="tlhead"><b>Timeline</b><span id="tlInfo"></span></div>
      <div id="strip" class="strip"></div>
      <div id="lane" class="lane"></div>
      <div id="mstrip" class="mstrip"></div>
    </div>
  </section>
  <aside>
    <nav class="tabs" id="tabs">
      <button data-tab="clip" class="on">Clip</button>
      <button data-tab="layers">Livelli</button>
      <button data-tab="capt">Sottotitoli</button>
      <button data-tab="style">Stile</button>
      <button data-tab="music">Musica</button>
      <button data-tab="sub">Iscriviti</button>
      <button data-tab="export">Esporta</button>
    </nav>
    <div id="insp" class="insp"></div>
  </aside>
</main>
<div id="modal" class="modal hidden"><div class="box" id="mbox"></div></div>
<div id="toast" class="toast"></div>
<footer>GPverse Studio <span id="footVer"></span> · funziona in locale e in cloud</footer>

function curT(){return tAtStart+Math.max(0,AC?AC.currentTime-clockStart:(performance.now()/1000-clockStart))}
let lastOn=-1;
function tick(){
  if(!playing)return;let t=curT();
  if(t>=LAY.total){playT=LAY.total;renderFrame(LAY.total-0.001);updateTime();if(recState)recState.mr.stop();if(exporting){finishExport();return}pause();return}
  playT=t;syncVideos(t);renderFrame(t);updateTime();
  if(exporting){$('#expBar')&&($('#expBar').style.width=(t/LAY.total*100).toFixed(1)+'%');const el=$('#expPct');if(el)el.textContent=`${fmtT(t)} / ${fmtT(LAY.total)}`}
  requestAnimationFrame(tick)}
function play(){if(!P.clips.length){toast('Aggiungi prima qualche foto o video');return}ensureAudio();if(playT>=LAY.total-0.05)playT=0;playing=true;
  const now=AC?AC.currentTime+0.06:performance.now()/1000;clockStart=now;tAtStart=playT;startMusic(playT,now);startSfx(playT,now);$('#playBtn').textContent='❚❚';requestAnimationFrame(tick)}
function pause(){playing=false;stopMusic();for(const r of RT.values())if(!r.v.paused)r.v.pause();$('#playBtn').textContent='▶';requestRender()}
function seek(t){playT=clamp(t,0,LAY.total);if(playing){stopMusic();for(const r of RT.values())r.v.pause();const now=AC?AC.currentTime+0.06:performance.now()/1000;clockStart=now;tAtStart=playT;startMusic(playT,now);startSfx(playT,now)}else requestRender();updateTime()}
function updateTime(){$('#tm').textContent=`${fmtT(playT)} / ${fmtT(LAY.total)}`;const sc=$('#scrub');sc.max=Math.max(0.01,LAY.total);if(document.activeElement!==sc)sc.value=playT;
  const ph=$('#phead');if(ph)ph.style.left=(playT/Math.max(0.01,LAY.total)*100)+'%';
  const on=LAY.items.findIndex(it=>playT>=it.start&&playT<it.end);if(on!==lastOn){lastOn=on;document.querySelectorAll('.clip').forEach((el,i)=>el.classList.toggle('on',i===on))}}

function undo(){if(!undoStack.length){toast('Niente da annullare');return}P=mergeProject(JSON.parse(undoStack.pop()));if(selId&&!P.clips.find(c=>c.id===selId))selId=P.clips[0]?.id||null;changed(true,true);toast('Annullato ↶')}

    $('#expPhase').textContent='Creo i fotogrammi…';for(const r of RT.values())r.v.pause();
    venc=new VideoEncoder({output:(ch,meta)=>muxer.addVideoChunk(ch,meta),error:e=>encErr=e});venc.configure(vc.cfg);
    const fd=1e6/fps,tStart=performance.now();let lastUi=0;
    for(let i=0;i<nF;i++){if(ex.cancelled)throw'cancel';if(encErr)throw encErr;const t=Math.min(i/fps,total-0.001);
      await prepVideosAt(t,fps);renderFrame(t);const fr=new VideoFrame(cv,{timestamp:Math.round(i*fd),duration:Math.round(fd)});venc.encode(fr,{keyFrame:i%(fps*2)===0});fr.close();
      while(venc.encodeQueueSize>6)await yieldUI();
      if(performance.now()-lastUi>200){lastUi=performance.now();const k=(i+1)/nF,el=(lastUi-tStart)/1000,eta=el/k-el;const b=$('#expBar');if(b)b.style.width=(k*100).toFixed(1)+'%';const pc=$('#expPct');if(pc)pc.textContent=`${Math.round(k*100)}% · ${fmtT(t)} / ${fmtT(total)} · mancano ~${Math.max(1,Math.round(eta))} s`;await yieldUI()}}
    await venc.flush();venc.close();venc=null;muxer.finalize();
    const blob=new Blob([target.buffer],{type:'video/mp4'});exporting=null;playT=0;
    showResult(blob,'mp4',ex.t0,[vc.mux==='vp9'?'Codec video VP9: YouTube lo accetta senza problemi.':'',!ac?'⚠️ Questo browser non sa codificare l\'audio: il video è muto, usa la modalità "Tempo reale".':'',missing?`⚠️ Non sono riuscito a leggere l'audio di ${missing} video: se ti serve, usa la modalità "Tempo reale".`:''].filter(Boolean).join(' '))}
  catch(e){try{venc&&venc.state!=='closed'&&venc.close()}catch(_){}exporting=null;hideModal();if(e==='cancel'||ex.cancelled)toast('Export annullato');else{console.error(e);toast('Export veloce non riuscito ('+(e&&e.message||e)+'): riprova in modalità "Tempo reale"',true)}}
  requestRender()}
function finishExport(){if(!exporting)return;const ex=exporting;playing=false;stopMusic();for(const r of RT.values())r.v.pause();$('#playBtn').textContent='▶';setTimeout(()=>{try{ex.rec.state!=='inactive'&&ex.rec.stop()}catch(e){}},ex.cancelled?0:350)}

/* ================= MODALI ================= */
function showModal(html,closable=true){$('#mbox').innerHTML=html;$('#modal').classList.remove('hidden');$('#modal').dataset.closable=closable?'1':''}
function hideModal(){$('#modal').classList.add('hidden')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&$('#modal').dataset.closable)hideModal()});
function showChangelog(){showModal(`<h3>GPverse Studio v${APP_VERSION}</h3><p class="hint">Versioni nel formato <b>Major.Minor.Patch</b>: Major = cambi grossi o incompatibili, Minor = nuove funzioni, Patch = correzioni.</p>`+CHANGELOG.map(c=>`<h4 style="margin:14px 0 4px;color:var(--vi)">v${c.v} · ${c.d}</h4><ul>${c.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`).join('')+`<button class="btn" onclick="hideModal()">Chiudi</button>`)}
function showHelp(){showModal(`<h3>Come si usa</h3><ul>
<li><b>＋ Media</b> o trascina file: foto e video vanno in timeline, l'audio in Musica.</li>
<li>Tocca una clip per modificarla: durata, transizione, Ken Burns, testo.</li>
<li>Tocca il cerchietto tra due clip per cambiare la transizione.</li>
<li>Su computer puoi trascinare le clip per riordinarle.</li>
<li><b>Scorciatoie:</b> <code>Spazio</code> play/pausa · <code>Ctrl+Z</code> annulla · <code>Canc</code> elimina clip.</li></ul>
<h4 style="color:var(--vi)">Locale e cloud</h4><ul><li><b>Cloud:</b> apri il link dell'app da qualunque dispositivo.</li><li><b>Locale/offline:</b> salva questo file HTML sul PC e aprilo con Chrome o Edge: funziona tutto, anche senza internet (cambiano solo i font).</li><li>Il progetto si salva da solo nel browser in cui lavori. Le foto restano sul tuo dispositivo: non vengono caricate da nessuna parte.</li></ul>
<p class="hint">Consiglio: per l'export usa Chrome/Edge su computer, scheda in primo piano.</p><button class="btn" onclick="hideModal()">Chiudi</button>`)}

/* ================= HEADER / GLOBAL ================= */
function addCard(type){if(type==='title')return addTitle();pushUndo();const t=type==='intro'?newIntro():newOutro();if(type==='intro')P.clips.unshift(t);else P.clips.push(t);selId=t.id;changed(true);select(t.id);toast(type==='intro'?'Intro aggiunta all\'inizio ✓':'Finale aggiunto in fondo ✓')}
function pickCard(){showModal(`<h3>Aggiungi una scheda</h3><div class="cardpick"><button class="btn" data-card="title">🎬 Titolo<small>Titolo del video o di un capitolo, dopo la clip selezionata</small></button><button class="btn" data-card="intro">⚡ Intro del canale<small>Logo animato + nome del canale, all'inizio del video</small></button><button class="btn" data-card="outro">🏁 Finale<small>"Grazie per la visione" + spazi per la schermata finale YouTube</small></button></div><button class="btn" onclick="hideModal()">Annulla</button>`);
  document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{hideModal();addCard(b.dataset.card)})}
function addTitle(){pushUndo();const t=newTitle();const c=getSel();const i=c?P.clips.indexOf(c)+1:0;P.clips.splice(i,0,t);selId=t.id;changed(true);select(t.id)}
$('#fileIn').addEventListener('change',e=>{handleFiles(e.target.files);e.target.value=''});
$('#addTitle').onclick=pickCard;$('#undoBtn').onclick=undo;$('#helpBtn').onclick=showHelp;$('#verBtn').onclick=showChangelog;
$('#newBtn').onclick=()=>{showModal(`<h3>Nuovo progetto?</h3><p>Il progetto attuale verrà cancellato da questo browser. Ricorda di esportare il video prima.</p><div class="grid2"><button class="btn danger" id="yesNew">Sì, ricomincia</button><button class="btn" onclick="hideModal()">Annulla</button></div>`);
  $('#yesNew').onclick=async()=>{pause();await DB.clear('media');await DB.clear('kv');for(const m of media.values())try{URL.revokeObjectURL(m.url)}catch(e){}media.clear();RT.clear();P=defaultProject();selId=null;undoStack.length=0;playT=0;hideModal();setTab('clip');changed(true);toast('Nuovo progetto ✨')}};
$('#projName').addEventListener('input',e=>{P.name=e.target.value;saveSoon()});
$('#playBtn').onclick=()=>playing?pause():play();$('#splitBtn').onclick=splitAtPlayhead;
let drag=null;const cvPt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
cv.addEventListener('pointerdown',e=>{if(exporting)return;const [px,py]=cvPt(e);const ids=[...ovBoxes.keys()].reverse();
  for(const id of ids){const bx=ovBoxes.get(id);if(px>=bx.x&&px<=bx.x+bx.w&&py>=bx.y&&py<=bx.y+bx.h){const o=P.overlays.find(x=>x.id===id);if(!o)continue;pushUndo();selOv=id;if(playing)pause();if(tab!=='layers')setTab('layers');else renderInsp();
    drag={o,dx:o.x-px/cv.width,dy:o.y-py/cv.height};try{cv.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault();renderLane();requestRender();return}}});
cv.addEventListener('pointermove',e=>{if(!drag)return;const [px,py]=cvPt(e);drag.o.x=Math.round(clamp(px/cv.width+drag.dx)*1000)/1000;drag.o.y=Math.round(clamp(py/cv.height+drag.dy)*1000)/1000;requestRender()});
const endDrag=()=>{if(drag){drag=null;saveSoon();renderInsp()}};cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);$('#toStart').onclick=()=>seek(0);
$('#scrub').addEventListener('input',e=>seek(parseFloat(e.target.value)));
document.addEventListener('keydown',e=>{if(exporting)return;const tg=e.target.tagName;const typing=tg==='INPUT'&&!['range','checkbox','color'].includes(e.target.type)||tg==='TEXTAREA'||tg==='SELECT';
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!typing){e.preventDefault();undo();return}if(typing)return;
  if(e.code==='Space'){e.preventDefault();playing?pause():play()}
  else if((e.key==='Delete'||e.key==='Backspace')&&getSel()){e.preventDefault();insp.querySelector('[data-act="del"]')?.click()}
  else if(e.key==='s'||e.key==='S')splitAtPlayhead();
  else if(e.key==='ArrowRight')seek(playT+1);else if(e.key==='ArrowLeft')seek(playT-1)});
let dragDepth=0;
window.addEventListener('dragenter',e=>{if(dragId||!e.dataTransfer||![...e.dataTransfer.types].includes('Files'))return;dragDepth++;$('#drop').classList.remove('hidden')});
window.addEventListener('dragleave',()=>{if(dragId)return;dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)$('#drop').classList.add('hidden')});
window.addEventListener('dragover',e=>{if(!dragId&&e.dataTransfer&&[...e.dataTransfer.types].includes('Files'))e.preventDefault()});
window.addEventListener('drop',e=>{if(dragId)return;e.preventDefault();dragDepth=0;$('#drop').classList.add('hidden');if(e.dataTransfer?.files?.length)handleFiles(e.dataTransfer.files)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&exporting)toast('⚠️ Torna su questa scheda: l\'export si blocca in background',true)});

/* ================= AVVIO ================= */
(async function init(){
  $('#verBtn').textContent='v'+APP_VERSION;$('#footVer').textContent='v'+APP_VERSION;
  try{const saved=await DB.get('kv','project');if(saved&&saved.clips){const recs=(await DB.all('media'))||[];for(const r of recs){try{await registerMedia(r)}catch(e){console.warn('media',r.name,e)}}P=mergeProject(saved);selId=P.clips[0]?.id||null;if(saved.v&&saved.v!==APP_VERSION)toast(`Progetto aggiornato a v${APP_VERSION}`)}}catch(e){console.warn(e)}
  changed(true);
  if(document.fonts){document.fonts.ready.then(()=>requestRender());FONTS.forEach(f=>document.fonts.load(`800 40px "${f}"`).then(()=>requestRender()).catch(()=>{}))}
})();
</script>
